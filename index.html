<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Globe.gl Simple Example</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }
        #globeViz {
            width: 100vw;
            height: 100vh;
        }
        .info {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 15px;
            border-radius: 5px;
            z-index: 1000;
        }
        h1 {
            margin: 0 0 10px 0;
            font-size: 24px;
        }
        p {
            margin: 5px 0;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="info">
        <h1>Globe.gl Example</h1>
        <p>Drag to rotate | Scroll to zoom</p>
        <p>LA → Taiwan → Bali → Labuan Bajo</p>
    </div>
    <div id="globeViz"></div>

    <script src="//unpkg.com/globe.gl"></script>
    <script>
        // Initialize the globe
        const world = Globe()
            (document.getElementById('globeViz'))
            .globeImageUrl('//unpkg.com/three-globe/example/img/earth-night.jpg')
            .backgroundImageUrl('//unpkg.com/three-globe/example/img/night-sky.png')
            .pointOfView({ lat: 39.6, lng: -98.5, altitude: 2 }); // Centered on USA

        // Define specific locations (flight path)
        const gData = [
            { lat: 34.05, lng: -118.24, size: 1, color: 'red', label: 'Los Angeles' },
            { lat: 25.03, lng: 121.56, size: 1, color: 'orange', label: 'Taiwan' },
            { lat: -8.65, lng: 115.22, size: 1, color: 'blue', label: 'Bali' },
            { lat: -8.50, lng: 119.88, size: 1, color: 'green', label: 'Labuan Bajo' }
        ];

        // Add points to the globe
        world.pointsData(gData)
            .pointAltitude(0.01)
            .pointColor('color')
            .pointRadius('size')
            .pointsMerge(true);

        // Add arcs connecting the flight path
        const arcsData = [
            // LA -> Taiwan
            { startLat: 34.05, startLng: -118.24, endLat: 25.03, endLng: 121.56, color: ['red', 'orange'] },
            // Taiwan -> Bali
            { startLat: 25.03, startLng: 121.56, endLat: -8.65, endLng: 115.22, color: ['orange', 'blue'] },
            // Bali -> Labuan Bajo
            { startLat: -8.65, startLng: 115.22, endLat: -8.50, endLng: 119.88, color: ['blue', 'green'] }
        ];

        world.arcsData(arcsData)
            .arcColor('color')
            .arcDashLength(0.4)
            .arcDashGap(0.2)
            .arcDashAnimateTime(3000)
            .arcStroke(0.5);

        // Add labels for each location
        world.labelsData(gData)
            .labelLat('lat')
            .labelLng('lng')
            .labelText('label')
            .labelSize(1.5)
            .labelDotRadius(0.4)
            .labelColor(() => 'rgba(255, 255, 255, 0.75)')
            .labelResolution(2);

        // Auto-rotate the globe
        world.controls().autoRotate = true;
        world.controls().autoRotateSpeed = 0.5;
    </script>
</body>
</html>
